# /etc/ssh/sshd_config.d/10-tunnel.conf
#
# Сниппет для приёма SSH-туннеля от вашего телефона.
# Проверить: sshd -t && sshd -T | grep -E 'allowtcpforwarding|gatewayports'
# Применить:  sudo systemctl restart sshd

# Разрешить проброс портов (без этого клиентский -R будет отклонён)
AllowTcpForwarding yes

# На каких интерфейсах VPS слушать проброшенный порт:
#   no             — только 127.0.0.1 (безопаснее, вход через ssh -L)
#   clientspecified— клиент решает (базовый вариант комплекта)
#   yes            — всегда на всех интерфейсах (обычно избыточно)
GatewayPorts clientspecified

# Необязательно: жёсткие рамки для пользователя туннеля.
# Раскомментируйте, если хотите держать политику на сервере, а не в строке ключа.
#
# Match User tunnel
#     AllowTcpForwarding remote      # только обратный проброс (-R)
#     PermitOpen none                # локальный проброс (-L) запрещён
#     PermitTTY no                   # терминал не нужен
#     ForceCommand /bin/false        # shell невозможен
